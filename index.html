<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de ALU 32-bit & Overflow MIPS</title>
    <style>
        :root {
            --bg-color: #1e1e2e;
            --card-bg: #2b2b3b;
            --text-color: #cdd6f4;
            --bit-zero: #45475a;
            --bit-one: #89b4fa;
            --bit-msb: #f38ba8;
            --carry-color: #f9e2af;
            --overflow-bg: #f38ba8;
            --overflow-text: #11111b;
        }

        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-color); color: var(--text-color); padding: 20px; margin: 0; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { text-align: center; color: #89b4fa; }
        .controls { background-color: var(--card-bg); padding: 20px; border-radius: 10px; display: flex; gap: 15px; align-items: center; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
        input[type="number"] { background: #181825; border: 1px solid #45475a; color: #cdd6f4; padding: 10px; border-radius: 5px; font-size: 16px; width: 160px; }
        select#operacao { background: #181825; border: 1px solid #45475a; color: #cdd6f4; padding: 10px; border-radius: 5px; font-size: 16px; }
        button { background-color: #89b4fa; color: #11111b; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background-color: #b4befe; }
        .preset-btn { background-color: #45475a; color: #cdd6f4; font-size: 12px; padding: 5px 10px; }

        .alert-box { display: none; padding: 15px; border-radius: 8px; font-weight: bold; text-align: center; margin-bottom: 20px; animation: pulse 1s infinite alternate; }
        .alert-box.active { display: block; background-color: var(--overflow-bg); color: var(--overflow-text); }
        @keyframes pulse { from { opacity: 0.85; transform: scale(0.99); } to { opacity: 1; transform: scale(1.01); } }

        .bit-section { background-color: var(--card-bg); padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        .bit-row-label { font-weight: bold; margin-bottom: 5px; display: flex; justify-content: space-between; }
        .bit-grid { display: grid; grid-template-columns: repeat(32, 1fr); gap: 2px; margin-bottom: 15px; direction: rtl; }

        .bit-cell { aspect-ratio: 1/1.3; background-color: var(--bit-zero); border-radius: 3px; display: flex; align-items: center; justify-content: center; font-family: monospace; font-size: 12px; transition: all 0.2s ease; }
        .bit-cell.active { background-color: var(--bit-one); color: #11111b; font-weight: bold; }
        .bit-cell.msb { border: 2px solid var(--bit-msb); }
        .bit-cell.carry-active { background-color: var(--carry-color); color: #11111b; font-weight: bold; box-shadow: 0 0 8px var(--carry-color); }
        .bit-index { font-size: 9px; color: #a6adc8; text-align: center; }

        .log-panel { background: #181825; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 13px; color: #a6e3a1; word-wrap: break-word; }
    </style>
</head>
<body>

<div class="container">
    <h1>Simulador de ALU & Detecção de Overflow MIPS</h1>

    <div class="controls">
        <div><label>Operando A:</label><br><input type="number" id="inputA" value="67"></div>
        <select id="operacao">
            <option value="soma">Soma (a + b)</option>
            <option value="sub">Subtração (a − b)</option>
            <option value="mul">Multiplicação (a × b)</option>
        </select>
        <div><label>Operando B:</label><br><input type="number" id="inputB" value="6"></div>
        <button onclick="executarSoma()">Calcular & Animar</button>

        <div style="width: 100%; text-align: center; margin-top: 10px;">
            <button class="preset-btn" onclick="carregarPreset('soma', 2147483647, 1)">Overflow na Soma (+)</button>
            <button class="preset-btn" onclick="carregarPreset('soma', -2147483648, -1)">Overflow na Soma (−)</button>
            <button class="preset-btn" onclick="carregarPreset('sub', 2147483647, -1)">Overflow na Subtração</button>
            <button class="preset-btn" onclick="carregarPreset('mul', 100000, 100000)">Overflow na Multiplicação</button>
            <button class="preset-btn" onclick="carregarPreset('mul', -2147483648, -1)">Caso Extremo: INT_MIN ÷ -1</button>
        </div>
    </div>

    <div id="alertBox" class="alert-box">⚠️ OVERFLOW DETECTADO! Transbordo no limite de 32-bit em Complemento de Dois.</div>

    <div class="bit-section">
        <div class="bit-grid" id="gridIndices"></div>
        <div class="bit-row-label"><span id="carryLabel">Vai-um (Carry Out):</span></div>
        <div class="bit-grid" id="gridCarry"></div>
        <div class="bit-row-label"><span>Operando A:</span><span id="labelAHex">0x00000000</span></div>
        <div class="bit-grid" id="gridA"></div>
        <div class="bit-row-label"><span id="labelBTitle">Operando B:</span><span id="labelBHex">0x00000000</span></div>
        <div class="bit-grid" id="gridB"></div>
        <hr style="border-color: #45475a; margin: 15px 0;">
        <div class="bit-row-label"><span id="labelResTitle">Resultado (Soma):</span><span id="labelResHex">0x00000000</span></div>
        <div class="bit-grid" id="gridRes"></div>
    </div>

    <div class="log-panel" id="logPanel">Iniciando o simulador...</div>
</div>

<script>
    // 1. CAPTURA GLOBAL DE ERROS (Para não falhar em silêncio)
    window.onerror = function(msg, url, line, col, error) {
        document.getElementById('logPanel').innerHTML = `<span style="color:#f38ba8; font-weight:bold;">ERRO CRÍTICO: ${msg} (Linha ${line})</span><br>Verifique o console (F12) para mais detalhes.`;
        return false;
    };

    let wasmInstance = null;
    const PTR_OVERFLOW = 1024;

    // Rótulos e símbolos de cada operação (usados pra atualizar a interface dinamicamente)
    const INFO_OPERACAO = {
        soma: { simbolo: '+', label: 'Soma', temCarryChain: true },
        sub:  { simbolo: '−', label: 'Subtração', temCarryChain: true },
        mul:  { simbolo: '×', label: 'Multiplicação', temCarryChain: false }
    };

    // 2. CRIAÇÃO IMEDIATA (Remove dependência do window.onload)
    criarGrids();
    carregarWasm();

    function criarGrids() {
        const containers = ['gridIndices', 'gridCarry', 'gridA', 'gridB', 'gridRes'];
        containers.forEach(id => {
            const el = document.getElementById(id);
            if (!el) return; // Segurança extra
            el.innerHTML = '';
            for (let i = 31; i >= 0; i--) {
                const cell = document.createElement('div');
                cell.className = 'bit-cell' + (i === 31 ? ' msb' : '');
                cell.id = `${id}_${i}`;
                if (id === 'gridIndices') {
                    cell.style.background = 'transparent';
                    cell.className = 'bit-index';
                    cell.innerText = i;
                } else {
                    cell.innerText = '0';
                }
                el.appendChild(cell);
            }
        });
        document.getElementById('logPanel').innerText = "Grade de bits criada com sucesso. Aguardando carregamento do WASM...";
    }

    async function carregarWasm() {
        try {
            const response = await fetch('aritmetica.wasm');
            if (!response.ok) throw new Error("Arquivo não encontrado no servidor.");
            const bytes = await response.arrayBuffer();
            const module = await WebAssembly.instantiate(bytes);
            wasmInstance = module.instance.exports;
            document.getElementById('logPanel').innerText = "✅ Módulo WebAssembly (aritmetica.wasm) carregado! Sistema pronto.";
        } catch (e) {
            document.getElementById('logPanel').innerHTML = `<span style="color:#f9e2af;">⚠️ Aviso: ${e.message} Rodando em modo de emulação JavaScript nativo.</span>`;
        }
    }

    function carregarPreset(op, a, b) {
        document.getElementById('operacao').value = op;
        document.getElementById('inputA').value = a;
        document.getElementById('inputB').value = b;
        executarSoma();
    }

    // Fallback em JavaScript puro (só usado se o módulo WASM não carregar).
    // Espelha exatamente a mesma lógica de sinais escrita em aritmetica.c.
    function calcularComFallbackJS(op, a, b) {
        if (op === 'soma') {
            const resultado = (a + b) | 0;
            const overflow = ((a ^ resultado) & (b ^ resultado)) < 0;
            return { resultado, overflow };
        }
        if (op === 'sub') {
            const resultado = (a - b) | 0;
            const overflow = ((a ^ b) & (a ^ resultado)) < 0;
            return { resultado, overflow };
        }
        // mul
        if (a === -2147483648 && b === -1) {
            return { resultado: -2147483648, overflow: true };
        }
        const resultado = (a * b) | 0;
        const overflow = (b !== 0) && (Math.trunc(resultado / b) !== a);
        return { resultado, overflow };
    }

    async function executarSoma() {
        const a = parseInt(document.getElementById('inputA').value) || 0;
        const b = parseInt(document.getElementById('inputB').value) || 0;
        const op = document.getElementById('operacao').value;
        const info = INFO_OPERACAO[op];

        let resultado = 0;
        let teveOverflow = false;

        const nomeFuncaoWasm = op + '_segura'; // soma_segura, sub_segura, mul_segura
        if (wasmInstance && wasmInstance[nomeFuncaoWasm]) {
            resultado = wasmInstance[nomeFuncaoWasm](a, b, PTR_OVERFLOW);
            if (wasmInstance.memory) {
                const mem = new Uint8Array(wasmInstance.memory.buffer);
                teveOverflow = mem[PTR_OVERFLOW] === 1;
            }
        } else {
            const r = calcularComFallbackJS(op, a, b);
            resultado = r.resultado;
            teveOverflow = r.overflow;
        }

        document.getElementById('alertBox').className = 'alert-box';
        document.getElementById('labelBTitle').innerText = 'Operando B:';
        document.getElementById('labelResTitle').innerText = `Resultado (${info.label}):`;
        document.getElementById('carryLabel').innerText = info.temCarryChain
            ? 'Vai-um (Carry Out):'
            : 'Multiplicação não usa cadeia de carry simples (overflow depende de magnitude, não de sinal):';

        const strA = (a >>> 0).toString(2).padStart(32, '0');
        const strB = (b >>> 0).toString(2).padStart(32, '0');

        document.getElementById('labelAHex').innerText = "0x" + (a >>> 0).toString(16).padStart(8, '0').toUpperCase();
        document.getElementById('labelBHex').innerText = "0x" + (b >>> 0).toString(16).padStart(8, '0').toUpperCase();

        for (let i = 0; i < 32; i++) {
            document.getElementById(`gridA_${i}`).innerText = strA[31 - i];
            document.getElementById(`gridA_${i}`).className = `bit-cell ${strA[31 - i] === '1' ? 'active' : ''} ${i === 31 ? 'msb' : ''}`;
            document.getElementById(`gridB_${i}`).innerText = strB[31 - i];
            document.getElementById(`gridB_${i}`).className = `bit-cell ${strB[31 - i] === '1' ? 'active' : ''} ${i === 31 ? 'msb' : ''}`;
            document.getElementById(`gridCarry_${i}`).innerText = '0';
            document.getElementById(`gridCarry_${i}`).className = 'bit-cell';
            document.getElementById(`gridRes_${i}`).innerText = '0';
            document.getElementById(`gridRes_${i}`).className = 'bit-cell';
        }

        if (info.temCarryChain) {
            // Soma e subtração: anima a cadeia de carry bit a bit (LSB -> MSB).
            // Subtração reaproveita a MESMA cadeia, igual a técnica da ULA:
            // a - b = a + NOT(b) + 1  ->  inverte b e injeta carry inicial = 1.
            const efetivoB = (op === 'sub') ? (~b) : b;
            let carry = (op === 'sub') ? 1 : 0;

            for (let i = 0; i < 32; i++) {
                let bitA = (a >> i) & 1;
                let bitB = (efetivoB >> i) & 1;
                let somaBit = bitA ^ bitB ^ carry;
                let proximoCarry = (bitA & bitB) | (carry & (bitA ^ bitB));

                document.getElementById(`gridRes_${i}`).innerText = somaBit;
                document.getElementById(`gridRes_${i}`).className = `bit-cell ${somaBit === 1 ? 'active' : ''} ${i === 31 ? 'msb' : ''}`;

                if (proximoCarry === 1 && i < 31) {
                    document.getElementById(`gridCarry_${i + 1}`).innerText = '1';
                    document.getElementById(`gridCarry_${i + 1}`).className = 'bit-cell carry-active';
                }
                carry = proximoCarry;
                await new Promise(r => setTimeout(r, 20));
            }
        } else {
            // Multiplicação: sem cadeia de carry simples de 32 posições.
            // Revela o resultado final (já calculado pelo WASM) direto, sem animação bit a bit.
            const strRes = (resultado >>> 0).toString(2).padStart(32, '0');
            for (let i = 0; i < 32; i++) {
                document.getElementById(`gridRes_${i}`).innerText = strRes[31 - i];
                document.getElementById(`gridRes_${i}`).className = `bit-cell ${strRes[31 - i] === '1' ? 'active' : ''} ${i === 31 ? 'msb' : ''}`;
                await new Promise(r => setTimeout(r, 8));
            }
        }

        document.getElementById('labelResHex').innerText = "0x" + (resultado >>> 0).toString(16).padStart(8, '0').toUpperCase();

        if (teveOverflow) document.getElementById('alertBox').className = 'alert-box active';

        document.getElementById('logPanel').innerHTML =
            `<b>Execução concluída (${info.label}):</b><br>` +
            `• Operando A: ${a}<br>` +
            `• Operando B: ${b}<br>` +
            `• Operação: a ${info.simbolo} b<br>` +
            `• Resultado: <b>${resultado}</b><br>` +
            `• Overflow detectado: <b>${teveOverflow}</b><br>` +
            `• Função WASM chamada: <code>${nomeFuncaoWasm}</code>`;
    }
</script>
</body>
</html>
